name: Build TypeyTypey

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TypeyTypey.Tests/TypeyTypey.Tests.csproj

      - name: Test
        run: dotnet test TypeyTypey.Tests/TypeyTypey.Tests.csproj --configuration Release --no-restore

      - name: Publish self-contained executable
        run: >
          dotnet publish TypeyTypey.csproj --configuration Release --runtime win-x64
          --self-contained true --no-restore
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TypeyTypey-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/TypeyTypey.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            bin/Release/net8.0-windows/win-x64/publish/TypeyTypey.exe
            README.md
            LICENSE
            RELEASE_NOTES.md
